name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Cache Python dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run tests
        run: |
          pytest tests/ -v --cov=backend --cov-report=term-missing || true
      
      - name: Lint with flake8
        run: |
          flake8 backend/ --max-line-length=120 --exclude=__pycache__,*.pyc || true
      
      - name: Format check with black
        run: |
          black --check backend/ || true

  build-docker:
    runs-on: ubuntu-latest
    needs: test-backend
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Build Docker image
        run: |
          docker build -t bollinger-squeeze-bot:latest .
      
      - name: Test Docker image
        run: |
          docker run --rm bollinger-squeeze-bot:latest python -c "import backend; print('Backend module loaded successfully')"
